# render.yaml — single-click blueprint for Render
# Place this at the repo root, then on Render: New → Blueprint → connect repo.

databases:
  - name: analytics-postgres
    plan: free          # 90-day expiry on free tier; upgrade to "starter" ($7/mo) for permanent
    region: oregon
    postgresMajorVersion: "16"

services:
  # ───── Redis ─────
  - type: keyvalue
    name: analytics-redis
    plan: free          # 25 MB
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ───── Web (FastAPI) ─────
  - type: web
    name: analytics-backend
    runtime: python
    region: oregon
    plan: free          # sleeps after 15 min idle
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    # preDeploy runs migrations BEFORE traffic shifts to a new deploy
    # preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a strong secret

      # Database wiring — pulled from the managed Postgres above
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }

      # Redis wiring — pulled from the managed Redis above
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }

      # CORS + Frontend URL — UPDATE these after Vercel deploy
      - key: BACKEND_CORS_ORIGINS
        value: https://CHANGE-ME.vercel.app
      - key: FRONTEND_URL
        value: https://CHANGE-ME.vercel.app

      # SMTP — set in Render dashboard after sign-up with an email provider
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_TLS
        value: "true"

  # ───── Celery worker ─────
  - type: worker
    name: analytics-worker
    runtime: python
    region: oregon
    plan: free          # workers never sleep on Render free tier
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService: { type: web, name: analytics-backend, envVarKey: SECRET_KEY }
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }
      - key: FRONTEND_URL
        value: https://CHANGE-ME.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_TLS
        value: "true"

  # ───── Celery beat ─────
  - type: worker
    name: analytics-beat
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: celery -A app.workers.celery_app beat --loglevel=INFO
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService: { type: web, name: analytics-backend, envVarKey: SECRET_KEY }
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }