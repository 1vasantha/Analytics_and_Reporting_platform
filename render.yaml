databases:
  - name: analytics-postgres
    plan: free       
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []         
services:
  # Redis
  - type: keyvalue
    name: analytics-redis
    plan: free             
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ──────────────── Web (FastAPI) ────────────────
  - type: web
    name: analytics-backend
    runtime: python
    region: oregon
    plan: free                # sleeps after 15 min; upgrade to "starter" ($7/mo) to keep awake
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip && pip install -e .
    # `alembic upgrade head` runs as a release-phase command so migrations
    # apply on every deploy before traffic shifts.
    # preDeployCommand: |
    #   alembic upgrade head && python -m scripts.seed
    startCommand: |
      alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true   # Render generates a 32+ char secret on first deploy
      # Database — pulled from the managed Postgres service above
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }
      # Redis — pulled from the managed Redis service above
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }
      # CORS — fill in your Vercel domain after deploy
      - key: BACKEND_CORS_ORIGINS
        value: https://analytics-backend-m7oh.onrender.com
      - key: FRONTEND_URL
        value: https://analytics-and-reporting-platform-enc882qle.vercel.app
      # SMTP — leave Mailhog defaults out; configure a real provider below if needed
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false           # set manually in dashboard (sensitive)
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@yourdomain.com
      - key: SMTP_TLS
        value: "true"

  # ──────────────── Celery worker ────────────────
  - type: worker
    name: analytics-worker
    runtime: python
    region: oregon
    plan: free                # workers do NOT sleep on free tier
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip && pip install -e .
    startCommand: |
      celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService: { type: web, name: analytics-backend, envVarKey: SECRET_KEY }
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }
      - key: FRONTEND_URL
        value: https://YOUR-FRONTEND.vercel.app
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@yourdomain.com
      - key: SMTP_TLS
        value: "true"

  # ──────────────── Celery beat (scheduler) ────────────────
  - type: worker
    name: analytics-beat
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip && pip install -e .
    startCommand: |
      celery -A app.workers.celery_app beat --loglevel=INFO
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService: { type: web, name: analytics-backend, envVarKey: SECRET_KEY }
      - key: POSTGRES_HOST
        fromDatabase: { name: analytics-postgres, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: analytics-postgres, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: analytics-postgres, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: analytics-postgres, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: analytics-postgres, property: database }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: analytics-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: analytics-redis, property: port }