<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>You're invited</title></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2>Join {{ organization_name }} on Analytics Platform</h2>
  <p>{{ inviter_name }} has invited you to join their team as <strong>{{ role }}</strong>.</p>
  <a href="{{ frontend_url }}/accept-invite?token={{ token }}"
     style="display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 500;">
    Accept invitation
  </a>
  <p style="margin-top: 24px; color: #9ca3af; font-size: 14px;">
    This invitation expires in 7 days. If you didn't expect this, you can safely ignore it.
  </p>
</body>
</html>
