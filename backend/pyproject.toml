[project]
name = "analytics-platform-backend"
version = "0.1.0"
description = "Real-time analytics & reporting platform backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "websockets==13.1",
    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    # Validation & settings
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    # Task queue & cache
    "celery[redis]==5.4.0",
    "redis==5.1.1",
    "flower==2.0.1",
    # HTTP
    "httpx==0.27.2",
    # Data processing
    "pandas==2.2.3",
    "numpy==2.1.2",
    # Email
    "aiosmtplib==3.0.2",
    "jinja2==3.1.4",
    # Observability
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    # CSV
    "python-magic==0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
    "faker==30.3.0",
    "ruff==0.7.0",
    "mypy==1.12.0",
    "pre-commit==4.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C90", "ASYNC", "S", "T20"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]